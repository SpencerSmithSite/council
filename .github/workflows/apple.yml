# Build and test the native Apple app in apple/ on every push and pull request
# that touches it.
#
# Separate from test.yml because it needs a macOS runner, which costs several
# times an ubuntu one and takes longer to start; the Flutter suite should not
# wait on it, and a change that only touches Dart should not pay for it.
#
# shared/golden/ is in the path filter because it is the contract between the
# two apps. A fixture change that the Swift side no longer matches has to fail
# here, not be discovered the next time someone happens to touch apple/.

name: Apple

on:
  push:
    branches: [main]
    paths: ["apple/**", "shared/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", "shared/**", ".github/workflows/apple.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # The app's deployment target is 26, which needs the Xcode 26 SDK or later.
    runs-on: macos-26
    # MLX (the downloaded on-device model) is a large C++ and Metal build, done
    # once per platform below; 30 minutes was sized before it.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # mlx-swift's manifest needs Swift tools 6.3 (Xcode 26.4 or later), and
      # the image's default Xcode may be older than the newest it carries. Use
      # the newest release Xcode installed, and say clearly if it's too old
      # rather than failing in package resolution.
      - name: Select Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version
          swift_version=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p')
          if [ "$(printf '%s\n6.3\n' "$swift_version" | sort -V | head -1)" != "6.3" ]; then
            echo "::error::MLX needs Swift 6.3 or later (Xcode 26.4+); the newest Xcode here has Swift $swift_version."
            exit 1
          fi

      # Xcode 26 and later ship the Metal compiler as a separate download, and
      # MLX compiles its kernels with it. Fetch it if the image lacks it.
      - name: Metal toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # project.yml is the source of truth and the .xcodeproj is generated
      # from it, but both are committed. Regenerate and fail on any diff, so a
      # hand edit in Xcode that project.yml doesn't know about can't land and
      # then vanish at the next regeneration.
      - name: Project matches project.yml
        run: |
          brew install xcodegen
          cd apple && xcodegen generate --quiet
          git diff --exit-code -- Council.xcodeproj Council/Info.plist

      # The query encoder's tests run the real model, which is gitignored for
      # its size. Same fetch as test.yml.
      - name: Fetch embedding model
        run: bash tools/fetch_model.sh

      # The scheme includes CouncilCore's test target, so this runs the core's
      # tests, including the golden fixtures, as well as building the app.
      - name: Test on macOS
        run: >
          xcodebuild test
          -project apple/Council.xcodeproj -scheme Council
          -destination 'platform=macOS'
          -derivedDataPath apple/.build/DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS Simulator
        run: >
          xcodebuild build
          -project apple/Council.xcodeproj -scheme Council
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/.build/DerivedData
          CODE_SIGNING_ALLOWED=NO

      # A device build as well, because MLX's Metal kernels are compiled per
      # SDK and the Simulator build doesn't exercise the iOS device one (the
      # Simulator can't run MLX at all; LocalModelBackend reports itself
      # unavailable there).
      - name: Build for iOS
        run: >
          xcodebuild build
          -project apple/Council.xcodeproj -scheme Council
          -destination 'generic/platform=iOS'
          -derivedDataPath apple/.build/DerivedData
          CODE_SIGNING_ALLOWED=NO
