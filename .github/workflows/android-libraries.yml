# Are the native libraries in the APK still loadable on a 16 KB page-size
# Android?
#
# Separate from `test.yml`, and deliberately not run on every push: this builds
# an Android APK, which takes minutes rather than seconds. What it guards
# against can only change when a dependency moves or the Android build does, so
# it runs when those files change and on request — often enough to catch a
# regression at the commit that caused it, rather than on an emulator months
# later with twenty libraries named and no way to tell which matter.
#
# Debug rather than release, because a release build needs the signing key and
# CI must never hold it. For the libraries this checks that changes nothing:
# every third-party binary is the same file in both.

name: Android libraries

on:
  push:
    branches: [main]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "tools/check_alignment.sh"
      - ".github/workflows/android-libraries.yml"
  pull_request:
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "tools/check_alignment.sh"
      - ".github/workflows/android-libraries.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  alignment:
    name: 16 KB page-size alignment
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gitignored but declared in pubspec.yaml — see test.yml.
      - name: Fetch the embedding model
        run: bash tools/fetch_model.sh

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: Check every 64-bit library
        run: bash tools/check_alignment.sh build/app/outputs/flutter-apk/app-debug.apk
